<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- PLACEHOLDER · v0.1.3 · 计划 v0.1.4 替换为真实 PNG -->
  <defs>
    <pattern id="phPattern" x="0" y="0" width="220" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <text x="0" y="50" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="900" fill="rgba(255,180,40,0.10)" letter-spacing="4">占位示意 · PLACEHOLDER</text>
    </pattern>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#10171f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg2)"/>
  <!-- 占位水印层（v0.1.3 部署期；上线时一眼可见） -->
  <rect width="960" height="540" fill="url(#phPattern)"/>
  <rect x="270" y="210" width="420" height="120" rx="14" fill="rgba(255,180,40,0.10)" stroke="rgba(255,180,40,0.55)" stroke-width="2"/>
