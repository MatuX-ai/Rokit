  <!-- 占位说明 -->
  <rect x="0" y="500" width="960" height="40" fill="rgba(255,180,40,0.10)"/>
    <text x="480" y="526" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#ffb428" letter-spacing="1">⛔ v0.1.3 占位示意图（非真实截图）· 计划 v0.1.4 替换为真实 PNG · 桌面应用启动后实拍为准</text>
