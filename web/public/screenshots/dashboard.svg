  <text x="412" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#fff" font-weight="600">数据看板</text>
  <text x="510" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">推广渠道</text>
  <text x="604" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">我的作品</text>
