      <text x="80" y="42" font-family="-apple-system,sans-serif" font-size="11" fill="#5A6B72">· 由刚才的发布队列实时回填</text>
      <text x="14" y="68" font-family="-apple-system,sans-serif" font-size="12" fill="#5A6B72">尚无发布记录。完成一次首秀发射后，这里会展示你实际发布的平台、时间与文案。</text>
    </g>
