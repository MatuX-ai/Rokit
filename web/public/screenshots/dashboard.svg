  <text x="480" y="298" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#ffb428" letter-spacing="2">PLACEHOLDER · v0.1.3 · 计划 v0.1.4 替换</text>
  <rect x="0" y="0" width="960" height="32" fill="#0e141b" stroke="#1f2a33" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="5" fill="#febc2e"/>
  <circle cx="52" cy="16" r="5" fill="#28c840"/>
  <text x="480" y="20" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#5A6B72">Rokit · 作品首秀发射台 · v0.1.1</text>
  <rect x="0" y="32" width="960" height="40" fill="#0a1018" stroke="#1f2a33"/>
  <text x="20" y="58" font-family="-apple-system,sans-serif" font-size="13" fill="#94D4D0" font-weight="700">🚀 Rokit</text>
  <text x="322" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">首秀向导</text>
