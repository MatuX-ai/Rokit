      <rect x="222" y="0" width="210" height="100" rx="8" fill="#0e141b" stroke="#1f2a33"/>
      <text x="236" y="24" font-family="-apple-system,sans-serif" font-size="10" fill="#5A6B72">被启用渠道</text>
      <text x="236" y="62" font-family="-apple-system,sans-serif" font-size="28" fill="#fff" font-weight="800">0</text>
      <text x="236" y="84" font-family="-apple-system,sans-serif" font-size="10" fill="#94a3a8">启用的推广渠道数</text>

      <rect x="444" y="0" width="210" height="100" rx="8" fill="#0e141b" stroke="#1f2a33"/>
      <text x="458" y="24" font-family="-apple-system,sans-serif" font-size="10" fill="#5A6B72">首发作品</text>
      <text x="458" y="62" font-family="-apple-system,sans-serif" font-size="28" fill="#fff" font-weight="800">0</text>
      <text x="458" y="84" font-family="-apple-system,sans-serif" font-size="10" fill="#94a3a8">本机登记的正式作品</text>

      <rect x="666" y="0" width="214" height="100" rx="8" fill="#0e141b" stroke="#1f2a33"/>
      <text x="680" y="24" font-family="-apple-system,sans-serif" font-size="10" fill="#5A6B72">最近发布</text>
      <text x="680" y="62" font-family="-apple-system,sans-serif" font-size="22" fill="#fff" font-weight="800">—</text>
      <text x="680" y="84" font-family="-apple-system,sans-serif" font-size="10" fill="#94a3a8">本机会话暂无发布</text>
    </g>
    <!-- bars empty state -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="880" height="180" rx="8" fill="#0e141b" stroke="#1f2a33"/>
      <text x="14" y="24" font-family="-apple-system,sans-serif" font-size="13" fill="#fff" font-weight="700">各渠道发布次数</text>
      <text x="14" y="42" font-family="-apple-system,sans-serif" font-size="11" fill="#5A6B72">本机会话 · 尚未发布 · 完成后这里会自动出现</text>
      <text x="440" y="106" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#5A6B72">尚无发布记录。完成一次首秀发射后，这里会按平台汇总发布次数。</text>
    </g>
