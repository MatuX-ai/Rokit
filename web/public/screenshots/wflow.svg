<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#10171f"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94D4D0"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- title bar -->
  <rect x="0" y="0" width="960" height="32" fill="#0e141b" stroke="#1f2a33" stroke-width="1"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="5" fill="#febc2e"/>
  <circle cx="52" cy="16" r="5" fill="#28c840"/>
  <text x="480" y="20" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#5A6B72">Rokit · 作品首秀发射台 · v0.1.1</text>
  <!-- nav tabs -->
  <rect x="0" y="32" width="960" height="40" fill="#0a1018" stroke="#1f2a33"/>
  <text x="20" y="58" font-family="-apple-system,sans-serif" font-size="13" fill="#94D4D0" font-weight="700">🚀 Rokit</text>
  <rect x="280" y="40" width="84" height="32" fill="#0e7c7b" opacity="0.7"/>
  <text x="322" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#fff" font-weight="600">首秀向导</text>
  <text x="416" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">数据看板</text>
  <text x="510" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">推广渠道</text>
  <text x="604" y="58" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#7a8a93">我的作品</text>
  <!-- main content -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="880" height="400" fill="#0e141b" rx="10" stroke="#1f2a33"/>
    <text x="20" y="34" font-family="-apple-system,sans-serif" font-size="15" fill="#fff" font-weight="700">你好，我是 Rokit</text>
    <text x="20" y="56" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3a8">你负责把作品做出来，剩下的——推广、录屏演示、拆条、配音、发布、反馈、迭代建议——交给我。</text>
    <text x="20" y="76" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3a8">告诉我你的第一个作品，我帮你把它发射出去。</text>
    <line x1="20" y1="100" x2="860" y2="100" stroke="#1f2a33"/>
    <!-- progress rail -->
    <text x="20" y="130" font-family="-apple-system,sans-serif" font-size="11" fill="#5A6B72" letter-spacing="2">首秀发射轨道</text>
    <g transform="translate(20, 144)">
      <circle cx="8" cy="8" r="6" fill="#0E7C7B"/>
      <circle cx="8" cy="38" r="6" fill="#0E7C7B"/>
      <circle cx="8" cy="68" r="6" fill="#0E7C7B" opacity="0.4"/>
      <circle cx="8" cy="98" r="6" fill="#0E7C7B" opacity="0.2"/>
      <text x="24" y="12" font-family="-apple-system,sans-serif" font-size="12" fill="#fff">登记作品</text>
      <text x="24" y="42" font-family="-apple-system,sans-serif" font-size="12" fill="#fff">生成物料</text>
      <text x="24" y="72" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3a8">一键发布</text>
      <text x="24" y="102" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3a8">数据追踪</text>
    </g>
    <!-- chat area -->
    <g transform="translate(180, 140)">
      <rect x="0" y="0" width="280" height="60" rx="10" fill="#0E7C7B" opacity="0.9"/>
      <text x="14" y="22" font-family="-apple-system,sans-serif" font-size="11" fill="#fff">📝 你的作品叫什么名字？</text>
      <text x="14" y="44" font-family="-apple-system,sans-serif" font-size="11" fill="#a8dad6">比如：便签天气 / 校园课表助手</text>
      <rect x="0" y="80" width="320" height="70" rx="10" fill="#1a232c" stroke="#0E7C7B"/>
      <text x="14" y="102" font-family="-apple-system,sans-serif" font-size="11" fill="#fff">好，收到。我先帮你做几件事：</text>
      <text x="14" y="120" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3a8">① 一句话定位  ② 目标人群  ③ 卖点</text>
      <text x="14" y="140" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3a8">④ 13 平台文案思路  ⑤ 72h 发布计划</text>
      <rect x="0" y="170" width="680" height="60" rx="10" fill="#0E7C7B" opacity="0.4"/>
      <text x="14" y="194" font-family="-apple-system,sans-serif" font-size="11" fill="#fff" font-weight="600">[ 输入框 ]  你的作品名 / 链接 / 一句话</text>
      <text x="14" y="218" font-family="-apple-system,sans-serif" font-size="11" fill="#a8dad6">支持 文字 / 链接 / 截图</text>
    </g>
  </g>
  <!-- bottom placeholder note -->
  <text x="480" y="530" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="10" fill="#5A6B72" letter-spacing="1">v0.1.1 真实界面占位 · v0.1.2 正式打包时替换为 PNG</text>
</svg>
